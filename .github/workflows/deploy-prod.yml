name: Deploy to Akamai PROD

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Brand variant to build — must exist in projectConfig.json > variants"
        required: true
        default: "SGH"
        type: string
      release:
        description: "Also produce release/<VARIANT>/<version>/"
        required: false
        default: false
        type: boolean

jobs:   
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'

      - name: Get node version
        id: node
        run: |
          echo "version=$(node -v)" >> "$GITHUB_OUTPUT"
      
      - name: Get node_modules cache
        uses: actions/cache@v4
        id: node_modules
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}-${{ steps.node.outputs.version }}

      - run: npm ci
      # The build is non-interactive only when VARIANT is set: without it the
      # prompt task waits for a TTY that CI does not have, and gulp exits 0
      # having produced nothing. LANGUAGE defaults to projectConfig.json > langs[0].
      - run: npm run build
        env:
          VARIANT: ${{ inputs.variant }}
          RELEASE: ${{ inputs.release }}

      - name: Save generated files
        run: |
          # this generate a file that contains the absolute path of the files
          find dist -type f -exec echo "\"{}\"," \; | sed "s#dist/#${{ vars.PROD_URL }}#g" > generated_files.json

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-files
          path: generated_files.json

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.ID_RSA }}
          name: id_rsa
          known_hosts: |
            luxottica-media.sftp.upload.akamai.com ${{ secrets.ID_RSA_PUB }}
          if_key_exists: replace
      
      # NOTE — one brand per run. The build now namespaces its output per variant
      # (release/<VARIANT>/<version>/), but SOURCE_FOLDER / DEST_FOLDER_PROD are
      # org-level variables pointing at a single path. Before fanning this job out
      # into a matrix over every variant, confirm with the Akamai owners how the
      # per-brand destination folders are laid out, otherwise parallel jobs would
      # overwrite each other at the same destination.
      - name: Deploy on Akamai
        run: | 
          cat /home/runner/.ssh/known_hosts 
          scp -o "StrictHostKeyChecking no" -o PubkeyAcceptedKeyTypes=+ssh-dss -o HostKeyAlgorithms=+ssh-dss -i /home/runner/.ssh/id_rsa  -rp ${{ vars.SOURCE_FOLDER }} sshacs@luxottica-media.sftp.upload.akamai.com:${{ vars.DEST_FOLDER_PROD }}

  clean-cache:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    env:
      CACHE_CLIENT_TOKEN: ${{ secrets.CACHE_CLIENT_TOKEN }}
      CACHE_CLIENT_SECRET: ${{ secrets.CACHE_CLIENT_SECRET }}
      CACHE_ACCESS_TOKEN: ${{ secrets.CACHE_ACCESS_TOKEN }}
      CACHE_BASE_URI: ${{ secrets.CACHE_BASE_URI }}
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.15.0'

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-files
          path: .

      - name: Clean Cache 
        run: |
          # Read json file
          GENERATED_FILES=$(cat generated_files.json)
          echo "Path being cleaned:"
          echo "${GENERATED_FILES}"

          echo CACHE_CLIENT_TOKEN=$CACHE_CLIENT_TOKEN > .env
          echo CACHE_CLIENT_SECRET=$CACHE_CLIENT_SECRET >> .env
          echo CACHE_ACCESS_TOKEN=$CACHE_ACCESS_TOKEN >> .env
          echo CACHE_BASE_URI=$CACHE_BASE_URI >> .env
          echo PATH_FILES_TO_CLEAN=$(cat generated_files.json) >> .env
          # cat .env

          npm install akamai-edgegrid   
          npm install dotenv

          node -e '
            require("dotenv").config();

            const CACHE_CLIENT_TOKEN = process.env.CACHE_CLIENT_TOKEN
            const CACHE_CLIENT_SECRET = process.env.CACHE_CLIENT_SECRET
            const CACHE_ACCESS_TOKEN = process.env.CACHE_ACCESS_TOKEN
            const CACHE_BASE_URI = process.env.CACHE_BASE_URI
            const GENERATED_FILES = process.env.PATH_FILES_TO_CLEAN.slice(0, -1);

            var EdgeGrid = require("akamai-edgegrid");

            console.log("======== Files being cleaning");
            let PATH_LIST = JSON.parse("[" + GENERATED_FILES + "]");
            console.log(PATH_LIST);

            var eg = new EdgeGrid(CACHE_CLIENT_TOKEN, CACHE_CLIENT_SECRET, CACHE_ACCESS_TOKEN, CACHE_BASE_URI);

            eg.auth({
              path: "/ccu/v3/invalidate/url/production",
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json"
                },
                body: {
                  objects: PATH_LIST
                }
                
            });
                
            eg.send(function(error, response, body) {
              if(response){
                console.log("======== Cache cleaned");
                console.log(response);
              }
              if(error){
                console.log("========= Error on cleaning cache");
                console.log(error.response.data);
              }
            });
          '
